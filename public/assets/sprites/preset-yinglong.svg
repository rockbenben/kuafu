<!-- viewBox 紧贴内容包围盒、height 恒为 220（理由见 preset-xingtian.svg） -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="220" viewBox="2 0 236 216">
  <!-- 应龙：有翼之龙。
       上一版翼画得又大又散，把 S 形身体和头颈整个淹掉了。这版翼收成一片、
       只在后上方开屏，羽端仍分缕但不再喧宾夺主；身体的 S 加粗加长，
       让「一条蜿蜒长身 + 昂起的头」重新成为 48px 下的第一读。 -->
  <g fill="#000">
    <!-- 翼：一片实心扇面，不开叉。
         画成分羽时它与尾鳍的分缕互相打架，整只龙读成「一堆分叉」——
         同一幅剪影里只能有一处碎边，这里让给尾鳍和爪。 -->
    <path d="M112 90
             C98 70 94 44 104 24
             C122 40 142 54 160 62
             C164 72 162 82 156 90 Z"/>
    <!-- S 形长身：加粗，头颈在右上 → 腹在中 → 尾卷向左下 -->
    <path d="M190 74
             C166 62 138 74 126 100
             C114 126 118 148 100 160
             C78 174 46 164 26 180
             C6 196 18 216 42 214
             C24 208 22 194 42 188
             C68 180 102 190 126 170
             C148 152 148 126 158 110
             C170 92 186 88 200 98 Z"/>
    <!-- 尾鳍：末端分三缕 -->
    <path d="M38 210 C24 218 10 218 2 212 C14 212 24 208 30 200
             C20 204 10 202 4 196 C16 198 26 194 32 186 Z"/>
    <!-- 颈：拉长露出，是这只龙的第一辨识线 -->
    <path d="M188 76 C196 58 210 44 228 40 L236 60
             C220 64 208 76 202 92 Z"/>
    <!-- 头：吻长 -->
    <path d="M224 38 C236 32 238 40 238 52 C238 62 232 70 222 72
             C212 74 204 68 204 58 C204 48 216 41 224 38 Z"/>
    <!-- 鹿角：两根分叉，粗到 48px 还看得见 -->
    <path d="M212 38 C206 22 196 10 184 4 C194 6 202 12 208 20
             C206 8 208 0 214 0 C214 12 218 24 222 34 Z"/>
    <path d="M228 36 C232 20 238 8 238 2 C238 16 236 28 234 38 Z"/>
    <!-- 颌须：一缕后飘 -->
    <path d="M210 68 C198 78 192 92 194 106 C188 92 192 76 204 66 Z"/>
    <!-- 前爪：三趾 -->
    <path d="M130 152 C136 166 146 178 160 186
             C154 176 152 168 154 162 C160 172 170 180 182 184
             C172 174 168 164 170 156
             C162 162 148 160 136 148 Z"/>
    <!-- 后爪 -->
    <path d="M88 164 C84 178 74 190 58 198
             C64 188 66 180 64 174 C56 184 44 190 32 192
             C44 184 50 174 50 164
             C60 170 74 170 84 160 Z"/>
  </g>
</svg>
