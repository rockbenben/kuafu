<!-- viewBox 紧贴内容包围盒、height 恒为 220（理由见 preset-xingtian.svg）。
     飞天原本底部留白 34px，贴地绘制时会整个悬空、还比别人矮两成。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="220" viewBox="6 10 205 176">
  <!-- 飞天：敦煌反弓身姿。
       上一版把飘带画成了闭合环，整体读作一个「甜甜圈」、人被困在圈心里——
       这版改成开放的长弧：一端从肩后甩出、一端向左后拖曳出画面，末梢分缕收尖。
       飘带不能围住身体，只能从身体「掠过」，人才飞得出去。 -->
  <g fill="#000">
    <!-- 主飘带：自右肩掠过身后，向左下长长拖出，末端分两缕 -->
    <path d="M196 40
             C204 66 198 96 178 118
             C158 140 128 152 96 154
             C70 156 46 150 28 138
             C46 154 74 164 102 164
             C136 164 168 152 190 128
             C210 106 216 72 206 44 Z"/>
    <path d="M28 138 C16 132 8 122 6 110 C14 126 28 138 46 146 Z"/>
    <path d="M96 154 C84 160 70 162 58 160 C74 166 90 166 104 162 Z"/>
    <!-- 副飘带：更细一条，反向从腰后翻出，末梢三缕 -->
    <path d="M118 132
             C96 148 66 154 40 148
             C58 158 84 158 106 150
             C92 162 72 170 52 170
             C74 178 100 172 118 158
             C112 170 102 180 90 186
             C112 182 128 168 134 148 Z"/>
    <!-- 身体：反弓成 C，胸腹外挺、腰后收 -->
    <path d="M126 62
             C144 56 160 64 166 80
             C172 96 166 114 154 124
             C142 134 126 140 114 136
             C104 132 100 122 102 112
             C104 96 112 72 126 62 Z"/>
    <!-- 头：微仰 -->
    <path d="M128 40 C142 34 156 40 160 52 C164 64 154 74 142 76
             C130 78 120 72 118 60 C116 50 120 44 128 40 Z"/>
    <!-- 高髻与发缕：三绺后扬，长短不齐 -->
    <path d="M130 38 C120 20 100 8 80 10 C96 14 108 24 112 36
             C96 28 80 32 68 44 C86 38 102 42 112 52
             C102 58 96 68 96 78 C104 62 118 50 132 48 Z"/>
    <!-- 后扬手臂：指尖收尖 -->
    <path d="M134 78 C116 74 98 80 88 92 C98 88 110 88 118 92
             C108 100 104 108 104 118 C112 104 126 96 140 96 Z"/>
    <!-- 前伸手臂：托花 -->
    <path d="M160 92 C178 92 194 84 202 72 C196 86 184 96 170 100
             C178 104 184 110 186 120 C178 108 164 104 152 106 Z"/>
    <!-- 后弯双腿：脚背绷直，向左后收 -->
    <path d="M120 134 C108 152 90 166 68 172
             C86 172 104 164 116 152
             C112 166 104 178 92 186
             C112 180 128 164 132 144 Z"/>
    <path d="M148 128 C154 146 150 164 140 178
             C156 168 164 148 160 128 Z"/>
  </g>
</svg>
