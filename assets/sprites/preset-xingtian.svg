<!-- viewBox 紧贴内容包围盒、height 恒为 220：renderer 按 sprite 高度定标
     （scale = PLAYER_H*1.7/220），viewBox 里留白多少，角色在游戏里就矮多少。
     刑天没有头，肩线从原 y=41 起，不裁的话它比别的形象矮掉近两成。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="220" viewBox="8 41 194 178">
  <!-- 刑天：断首而战，以乳为目、以脐为口。剪影里最强的辨识点就是「肩上没有头」——
       肩线走成一条平缓的弧直接收口，别让任何东西冒出去，否则一眼看去就成了普通武士。
       画法上与前一版的根本差别：躯干/四肢是连续贝塞尔轮廓，不是圆加梯形拼贴。 -->
  <g fill="#000">
    <!-- 躯干：无头，肩线闭合；胸廓宽厚，腰收，胯部外张 -->
    <path d="M74 62
             C72 50 82 44 96 44
             C112 44 124 50 122 62
             C130 74 134 88 133 102
             C132 118 126 130 124 142
             C122 152 110 156 98 156
             C86 156 74 152 73 142
             C71 128 66 116 65 102
             C64 88 67 73 74 62 Z"/>
    <!-- 举斧的右臂：从肩窝甩出，肘部有折角 -->
    <path d="M120 66 C134 62 148 68 156 80 C162 90 164 100 162 108
             C158 110 152 108 149 100 C145 88 136 80 122 82 Z"/>
    <!-- 战斧：长柄斜举，斧刃开阔带尖角 -->
    <path d="M150 96 L162 92 L196 200 L184 206 Z"/>
    <path d="M138 66 C152 44 178 36 200 44 C186 50 176 62 174 76
             C186 72 196 76 202 86 C186 84 172 90 164 102
             C158 90 148 78 138 66 Z"/>
    <!-- 持盾的左臂 -->
    <path d="M76 68 C62 66 50 74 44 88 C40 98 40 108 43 114
             C48 114 53 110 55 102 C58 90 64 84 78 84 Z"/>
    <!-- 干盾：椭圆盾牌，边缘有铆凸 -->
    <path d="M42 78 C22 78 8 98 8 122 C8 146 22 166 42 166
             C50 158 54 142 54 122 C54 102 50 86 42 78 Z"/>
    <!-- 腰带与战裙：下摆撕成三片尖稍，是这具躯体唯一的「布」 -->
    <path d="M72 140 L126 140 C130 156 128 172 122 186
             L114 168 L110 190 L102 170 L96 194 L88 172 L80 188
             C70 170 68 154 72 140 Z"/>
    <!-- 后腿：撑地，小腿绷直 -->
    <path d="M80 178 C76 192 74 204 76 216 L92 216
             C90 202 92 190 96 178 Z"/>
    <!-- 前腿：跨出，膝微屈 -->
    <path d="M108 178 C112 190 120 200 132 208
             C138 212 140 216 138 219 L118 214
             C108 206 100 194 98 180 Z"/>
  </g>
</svg>
