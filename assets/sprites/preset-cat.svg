<!-- viewBox 紧贴内容包围盒、height 恒为 220（理由见 preset-xingtian.svg）。
     这一只是唯一带 stroke 的：getBBox() **不含描边**，照它裁会削平尾巴左缘、
     右侧胡须尖和左脚掌底。下面的边界是渲染后逐像素量出来的（含描边），别按
     getBBox 改回去。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="138" height="220" viewBox="7 5 136 217">
  <!-- 彩色卡通样例：橘猫。用来告诉玩家「传彩色图也行，长这样」——
       游戏其余角色都是黑剪影，所以这只故意上色，作对照。 -->
  <g stroke="#3a2415" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 尾巴 -->
    <path d="M44 150 C14 148 6 116 24 100 C34 92 46 98 44 110 C42 120 30 118 32 128 C34 140 50 140 56 136" fill="none" stroke-width="13"/>
    <!-- 后腿 -->
    <path d="M56 158 L78 158 L74 190 L52 206 L38 210 L44 218 L66 210 L88 188 Z" fill="#e8913f"/>
    <!-- 身 -->
    <path d="M58 112 L112 112 C124 112 128 126 126 142 L124 166 L56 166 Z" fill="#f0a24e"/>
    <!-- 前腿 -->
    <path d="M100 160 L120 160 L126 186 L118 206 L138 214 L112 218 L96 196 Z" fill="#e8913f"/>
    <!-- 白肚 -->
    <path d="M74 128 C86 122 100 124 108 132 C112 148 106 162 92 164 C78 162 70 146 74 128 Z" fill="#fff4e2" stroke="none"/>
    <!-- 头 -->
    <circle cx="92" cy="72" r="42" fill="#f0a24e"/>
    <!-- 双耳 -->
    <path d="M56 46 L52 8 L86 34 Z" fill="#f0a24e"/>
    <path d="M126 44 L136 8 L100 32 Z" fill="#f0a24e"/>
    <path d="M62 40 L60 20 L80 34 Z" fill="#f6b9a0" stroke="none"/>
    <path d="M122 38 L128 20 L108 32 Z" fill="#f6b9a0" stroke="none"/>
    <!-- 吻部 -->
    <ellipse cx="92" cy="86" rx="22" ry="15" fill="#fff4e2" stroke="none"/>
    <!-- 眼 -->
    <ellipse cx="76" cy="66" rx="6" ry="8" fill="#3a2415" stroke="none"/>
    <ellipse cx="108" cy="66" rx="6" ry="8" fill="#3a2415" stroke="none"/>
    <circle cx="78" cy="63" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="110" cy="63" r="2.2" fill="#fff" stroke="none"/>
    <!-- 鼻与嘴 -->
    <path d="M86 80 L98 80 L92 87 Z" fill="#d4695a" stroke="none"/>
    <path d="M92 87 L92 91 M92 91 C88 95 82 94 80 90 M92 91 C96 95 102 94 104 90" fill="none" stroke-width="3.5"/>
    <!-- 胡须 -->
    <path d="M64 80 L44 76 M64 88 L44 90 M120 80 L140 76 M120 88 L140 90" fill="none" stroke-width="3.5"/>
    <!-- 额纹 -->
    <path d="M84 34 L80 48 M92 32 L92 46 M100 34 L104 48" fill="none" stroke-width="4"/>
  </g>
</svg>
