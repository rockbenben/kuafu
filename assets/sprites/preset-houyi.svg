<!-- viewBox 紧贴内容包围盒、height 恒为 220（理由见 preset-xingtian.svg） -->
<svg xmlns="http://www.w3.org/2000/svg" width="202" height="220" viewBox="8 11 192 209">
  <!-- 后羿：开弓如满月。轮廓靠「大圆弧的弓 + 反向绷直的双臂」立住，
       48px 下弓弦是一条极细的线会消失，所以弓臂本身画粗、弦只作暗示。 -->
  <g fill="#000">
    <!-- 弓：满月大弧，两端渐细收尖 -->
    <path d="M168 18
             C192 54 194 106 172 158
             C168 168 164 174 160 176
             C158 172 160 166 164 156
             C182 108 180 62 160 26
             C156 18 156 14 158 12
             C162 10 165 13 168 18 Z"/>
    <!-- 弦：拉成尖角，比弓细但不能细到消失 -->
    <path d="M162 16 L166 20 L118 100 L166 176 L162 180 L110 102 Z"/>
    <!-- 箭：搭在弦上指向前方 -->
    <path d="M116 98 L200 92 L200 100 L116 106 Z"/>
    <path d="M110 96 L124 88 L124 116 L110 108 Z"/>
    <!-- 束发与发带：数缕后扬，分成不等长的尖稍 -->
    <path d="M64 40 C48 30 28 26 14 32 C26 34 36 40 42 48
             C28 46 16 52 8 62 C24 58 38 60 48 68
             C38 72 30 80 26 90 C40 78 54 74 66 76 Z"/>
    <!-- 头：侧脸，鼻梁与下颌成折线 -->
    <path d="M62 40 C74 34 88 38 94 50 C98 58 96 66 92 72
             L100 78 L90 82 C88 90 80 94 72 92
             C62 88 56 78 56 66 C56 54 58 45 62 40 Z"/>
    <!-- 躯干：侧身站姿，胸挺、腰收 -->
    <path d="M66 92 C80 90 92 98 96 112
             C100 126 98 142 94 154
             C88 158 76 158 68 154
             C62 140 60 120 62 106 Z"/>
    <!-- 前臂：直伸持弓 -->
    <path d="M92 100 C112 96 136 96 156 100 L156 112
             C136 116 112 116 92 114 Z"/>
    <!-- 后臂：屈肘拉弦到耳后 -->
    <path d="M88 102 C100 96 112 94 120 98 L118 110
             C110 108 100 110 92 116 Z"/>
    <!-- 衣袍下摆：三片尖稍向后飘 -->
    <path d="M64 150 L98 150 C102 168 98 186 88 200
             L82 180 L74 198 L66 178 L56 192
             C54 176 56 162 64 150 Z"/>
    <!-- 后腿：绷直支撑 -->
    <path d="M62 186 C56 198 54 208 56 218 L72 218
             C70 206 72 196 76 186 Z"/>
    <!-- 前腿：弓步前踏 -->
    <path d="M88 188 C94 198 104 206 116 212
             C122 214 124 218 122 220 L102 216
             C90 208 82 198 80 188 Z"/>
  </g>
</svg>
