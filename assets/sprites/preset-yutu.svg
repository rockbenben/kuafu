<!-- viewBox 紧贴内容包围盒、height 恒为 220（理由见 preset-xingtian.svg） -->
<svg xmlns="http://www.w3.org/2000/svg" width="137" height="220" viewBox="25 6 133 214">
  <!-- 玉兔：直立奔跑、捧药杵。轮廓的三处凸起——长耳、蓬尾、举起的杵——
       撑住 48px 下的辨识；身体是一条前倾的连续曲线，不再是圆头接梯形身。 -->
  <g fill="#000">
    <!-- 长耳·后：细长带弯，末端收尖 -->
    <path d="M74 66 C62 44 54 18 60 8 C68 0 76 22 80 46 C82 56 80 62 78 68 Z"/>
    <!-- 长耳·前：与后耳错开角度，免得成一对平行棍 -->
    <path d="M92 62 C98 38 114 12 124 18 C132 26 116 50 104 70 Z"/>
    <!-- 头与躯干：一条连续轮廓，吻部→额→颈背→背→臀 -->
    <path d="M126 88
             C120 78 112 72 102 70
             C92 68 84 70 80 76
             C78 86 78 94 76 102
             C72 116 64 128 60 142
             C56 156 58 168 64 176
             C76 182 96 182 108 176
             C116 168 118 154 116 140
             C114 126 116 110 122 100
             C126 96 128 92 126 88 Z"/>
    <!-- 蓬尾：贴在臀后的一团，边缘毛茸有起伏 -->
    <path d="M60 140 C46 136 34 142 30 154 C26 166 32 178 44 182
             C40 172 42 162 50 156 C46 166 50 176 60 178
             C56 168 58 156 66 150 Z"/>
    <!-- 前肢：举起捧杵 -->
    <path d="M116 96 C130 88 146 86 158 90 L156 102
             C144 100 132 104 122 112 Z"/>
    <!-- 药杵：斜举，两端粗中间细 -->
    <path d="M142 46 C150 44 156 48 156 56 L150 116
             C150 124 144 128 138 126 C132 124 130 118 132 112
             L138 54 C138 50 140 47 142 46 Z"/>
    <!-- 后腿：大幅后蹬，跟腱绷出尖角 -->
    <path d="M66 174 C60 186 50 196 36 202
             C28 206 24 212 26 218 L46 212
             C62 204 74 192 78 176 Z"/>
    <!-- 前腿：向前抬起，脚掌上翘 -->
    <path d="M100 176 C106 188 112 198 122 206
             C130 212 134 218 132 220 L110 214
             C98 204 92 190 90 176 Z"/>
  </g>
</svg>
