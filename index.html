<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <!-- 不用 viewport-fit=cover：那会让 100vw 的画布铺到刘海底下，而 HUD 是画在 canvas 里的
       （ui.ts 的 HX=22 / RX=vw-22 / 两枚牌 margin=16，都是世界单位）。横持 iPhone 时
       22 世界单位≈15 CSS px，而刘海侧的安全区有 47~59 px——分数和牌子会被啃掉一截。
       画布内的东西没法用 env() 顶回来，索性让浏览器把整页收进安全区，刘海侧留一条
       与 body 同色的暗边。#tc / #gh 里的 env(safe-area-inset-*) 此时恒为 0，留着无害。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- 与 body 底色同色：进全屏之前（以及 iPhone 上永远进不了全屏时），
       手机浏览器的地址栏会染成这个色，视觉上并进画面，不再是一条突兀的白条 -->
  <meta name="theme-color" content="#0a0a12" />
  <title>逐光 · Chasing Light</title>
  <!-- 追日之日：内嵌 SVG 图标，无需外部文件 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a0f08'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd27a'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffcf7a' stroke-width='1.2' stroke-opacity='.5'/%3E%3C/svg%3E" />
  <meta name="description" content="逐光·夸父逐日——剪影风神话跑酷：化身夸父追逐永不可及的太阳，拾日光壮行、发夸父跨步、逃长夜之追噬，看你能逐日多远。" />
  <!-- 链接预览（分享到社媒时的卡片）。此处为简体默认页；构建后由 scripts/prerender.mjs
       为每个语种改写 title/description/og:*/canonical 并补 hreflang，产出 /en/ /ja/ 等页 -->
  <meta property="og:title" content="逐光 · 夸父逐日" />
  <meta property="og:description" content="剪影风神话跑酷：化身夸父追逐永不可及的太阳，看你能逐日多远。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kuafu.newzone.top/" />
  <meta property="og:image" content="https://kuafu.newzone.top/og/zh-Hans.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kuafu.newzone.top/og/zh-Hans.jpg" />
  <style>
    html, body {
      margin: 0; height: 100%; background: #0a0a12; overflow: hidden;
      /* 移动端硬化：禁选中/长按菜单/点击高亮/下拉刷新回弹 */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* 高度用 dvh：移动端 100vh 恒等于「地址栏收起时」的大视口高，而 renderer 按
       innerHeight（当前可见高）设 backing store，两者差出地址栏那一截，画面被纵向
       拉伸约 10~15%。dvh 跟随当前可见高，两边就对上了。100vh 一行留作老浏览器兜底。 */
    #game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    /* 源码链接：仅标题页显示，风格随游戏楷体暖调 */
    #gh {
      position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      display: none; z-index: 10;
      font: 13px "STKaiti", "KaiTi", "楷体", "BiauKai", serif;
      color: rgba(240, 228, 210, 0.5); text-decoration: none;
      letter-spacing: 0.06em; transition: color 0.2s;
    }
    #gh:hover { color: rgba(255, 225, 160, 0.95); }
    /* 换形象：主功能，做成标题下方一枚醒目的胶囊键（带当前形象的圆形预览）。
       用原生 file input，不进 canvas 命中判定那串守卫里（那里第 6 段把鼠标全挡掉了）。
       「还原」只在已换过形象时出现——传错一张图若无路可退，人就卡在那儿了。 */
    /* left/top 由 placeAvBar() 按世界坐标算出——canvas 是信箱化的，用 vh 猜位置
       会在某些窗口比例下正好压住「按任意键，起而逐日」。这里的值只是首帧兜底。 */
    #avbar {
      position: fixed; left: 50%; top: 82%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; gap: 0.5em; align-items: center;
      z-index: 10; white-space: nowrap;
      font: 15px "STKaiti", "KaiTi", "楷体", "BiauKai", serif; letter-spacing: 0.08em;
    }
    #avbar.on { display: flex; }
    /* 结算页：底边对齐锚点、向上生长。那一屏底下没有余量——居中对齐时展开态
       （一排圆 + 提示行）会直接溢出屏幕底部。 */
    #avbar.anchor-bottom { transform: translate(-50%, -100%); }
    #avrow { display: flex; gap: 0.93em; align-items: center; }
    /* 「还能传自己的图」只在展开时说——收起态挂着它就成了常驻噪音 */
    #avtip { font-size: 0.8em; color: rgba(240, 228, 210, 0.62); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
    #avbar:not(.open) #avtip { display: none; }
    /* 主键：暖金边的暗石胶囊，与触屏控制键同一族（玄石为体、落日为光）。
       内部尺寸一律用 em——font-size 由 placeAvBar() 按信箱化 scale 设，
       否则 canvas 里的牌随窗口放大、这颗键却恒为 15px，越大的屏越显得小。 */
    #av {
      display: flex; align-items: center; gap: 0.73em; cursor: pointer;
      font: inherit; letter-spacing: inherit; -webkit-appearance: none; appearance: none;
      padding: 0.47em 1.33em 0.47em 0.47em; border-radius: 999px; min-height: 44px;
      border: 1px solid rgba(255, 207, 122, 0.44);
      background: radial-gradient(circle at 62% 34%, rgba(58, 35, 20, 0.62), rgba(9, 5, 3, 0.68) 72%);
      color: rgba(255, 238, 208, 0.94);
      box-shadow: 0 0 16px rgba(255, 176, 92, 0.18), 0 4px 14px rgba(0, 0, 0, 0.42);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s;
    }
    #av:hover, #av:focus-within {
      border-color: rgba(255, 225, 160, 0.92);
      box-shadow: 0 0 26px rgba(255, 190, 110, 0.42), 0 4px 14px rgba(0, 0, 0, 0.42);
    }
    #av:active { transform: scale(0.97); }
    /* 圆形预览：直接给出「换的是这个」的所指，比任何文案都短 */
    #av-thumb {
      width: 2.2em; height: 2.2em; border-radius: 50%; object-fit: contain; object-position: center bottom;
      /* 亮底：内置素材是纯黑剪影，压在暗胶囊上等于看不见 */
      background: rgba(255, 232, 200, 0.62); border: 1px solid rgba(255, 207, 122, 0.34);
      padding: 0.13em; box-sizing: border-box;
    }
    #av-reset {
      color: rgba(240, 228, 210, 0.52); cursor: pointer; font-size: 0.85em;
      transition: color 0.2s; text-decoration: underline dotted rgba(240, 228, 210, 0.3);
    }
    #av-reset:hover, #av-reset:focus-visible { color: rgba(255, 225, 160, 0.95); outline: none; }
    #av-reset[hidden] { display: none; }
    #avpick input { display: none; }
    /* 展开态：一排圆形缩略图就地替掉胶囊，不另开面板——标题页上下都挤，
       多一层浮层就得再解一次「压住哪行字」的定位问题。 */
    #avpick { display: none; gap: 0.5em; align-items: center; }
    #avbar.open #av, #avbar.open #av-reset { display: none; }
    #avbar.open #avpick { display: flex; }
    .avopt {
      /* button 不继承父级 font-size（默认 13.33px），label 却继承——不显式 inherit，
         这一排里 <button> 的预设圆和 <label> 的「＋」会差出一整圈 */
      font: inherit;
      /* 小屏上 font-size 被 clamp 到 13px，2.9em 只有 37.7px——低于可点最小尺寸，
         拇指常按空。与触屏控制键同一条 44px 下限（见 #tc 那段注释）。 */
      width: max(2.9em, 44px); height: max(2.9em, 44px);
      padding: 0.12em; box-sizing: border-box;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      background: rgba(255, 232, 200, 0.62);
      border: 2px solid rgba(255, 207, 122, 0.34);
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
    }
    .avopt img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block; }
    .avopt:hover, .avopt:focus-visible {
      border-color: rgba(255, 225, 160, 0.95); transform: scale(1.08); outline: none;
      box-shadow: 0 0 16px rgba(255, 190, 110, 0.5);
    }
    /* 当前选中：亮一圈，否则一排圆里认不出自己现在是谁 */
    .avopt.cur { border-color: rgba(255, 232, 180, 1); box-shadow: 0 0 18px rgba(255, 196, 120, 0.72); }
    /* 「+」上传：暗底，与预设区分开——它不是第七个形象 */
    #av-more {
      background: radial-gradient(circle at 62% 34%, rgba(58, 35, 20, 0.72), rgba(9, 5, 3, 0.78) 72%);
      color: rgba(255, 226, 178, 0.9);
    }
    /* ＋ 放大只放大字形，不能动 .avopt 的 font-size——那会连圆的直径一起放大 */
    #av-more span { font-size: 1.45em; line-height: 1; }
    /* 矮屏（横持手机）标题区本就挤，胶囊缩一档免得压到「按任意键」 */

    /* 触屏控制·逐日 —— 玄石为体、落日斜掠为光、楷书为言：
       静息是被低日打亮的暗石碟（受光偏右上=所追之日方向，凸面感）；按下自石心迸出
       日光、字亮如曦白（拾日光）。控制字皆楷书动词：退·进·跃·冲·跨。仅粗指针游玩时 .on 显示 */
    /* 退·辅键尺寸：按 vh 缩放，但不得小于 44px——横持小屏（375px 高）时
       10vh 只有 37.5px，低于可点最小尺寸，拇指常按空。进键的左偏移跟着它走，
       否则退键一变大就与进键叠在一起。 */
    #tc { position: fixed; inset: 0; z-index: 9; display: none; pointer-events: none; --back: max(10vh, 44px); }
    #tc.on { display: block; }
    #tc button {
      position: absolute; pointer-events: auto; margin: 0; padding: 0;
      border-radius: 50%; border: 1px solid rgba(255, 207, 122, 0.30);
      background: radial-gradient(circle at 62% 34%, rgba(48, 29, 17, 0.44), rgba(9, 5, 3, 0.52) 72%);
      color: rgba(247, 236, 216, 0.76);
      /* 楷体栈在前供中日的汉字按钮；后接符号字体，供英/韩用的 ◀ ▶ ▲ ≫ ★——
         浏览器逐字形回退，非 CJK 设备上兜底的拉丁 serif 并不带这些码位，
         少了符号字体就会出豆腐块，而按钮上的字是识别它的唯一线索。 */
      font-family: "STKaiti", "KaiTi", "楷体", "BiauKai",
        "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif, serif;
      line-height: 1; font-weight: 500;
      -webkit-tap-highlight-color: transparent; touch-action: none;
      display: flex; align-items: center; justify-content: center;
      /* 落日斜掠：右上内高光 + 左下内阴影 = 被低日打亮的暗石凸面；外投影托起 */
      box-shadow:
        inset -1.5px 1.5px 3px rgba(255, 214, 150, 0.24),
        inset 1.5px -1.5px 4px rgba(0, 0, 0, 0.40),
        0 4px 14px rgba(0, 0, 0, 0.40);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 0 9px rgba(255, 190, 110, 0.22);
      transition: background .09s ease, transform .09s ease, border-color .09s ease, color .09s ease, box-shadow .09s ease;
    }
    /* 按下·自石心迸出日光（signature）：字亮如曦白 */
    #tc button:active {
      background: radial-gradient(circle at 50% 50%, rgba(255, 218, 152, 0.66), rgba(255, 150, 74, 0.22) 55%, rgba(9, 5, 3, 0.32));
      border-color: rgba(255, 220, 158, 0.9); color: #fff3d8; transform: scale(0.94);
      box-shadow: inset -1px 1px 2px rgba(255, 236, 200, 0.4), 0 0 20px rgba(255, 185, 100, 0.5), 0 3px 10px rgba(0, 0, 0, 0.35);
      text-shadow: 0 0 12px rgba(255, 214, 150, 0.7);
    }
    /* 逐日恒向前：进 为主（大碟，石心含一点落日之火，拇指常驻）；退 为辅（小碟，偶尔回身） */
    #tc-right { width: 16.5vh; height: 16.5vh; font-size: 6.4vh;
      left: calc(3.5vw + env(safe-area-inset-left, 0px) + var(--back) + 8px);
      bottom: calc(4.5vh + env(safe-area-inset-bottom, 0px)); }
    #tc-left { width: var(--back); height: var(--back); font-size: max(4vh, 17px);
      left: calc(3.5vw + env(safe-area-inset-left, 0px));
      bottom: calc(5.5vh + env(safe-area-inset-bottom, 0px)); }
    /* 进·主控：靠"更大 + 一点含蓄暖核"作主，而非发光抢眼（游玩时长驻眼角，须克制） */
    #tc button#tc-right {
      background: radial-gradient(circle at 50% 54%, rgba(255, 150, 74, 0.22), rgba(48, 29, 17, 0.46) 46%, rgba(9, 5, 3, 0.54) 76%);
      border-color: rgba(255, 190, 120, 0.42);
      box-shadow:
        inset -1.5px 1.5px 3px rgba(255, 216, 154, 0.26),
        inset 1.5px -1.5px 4px rgba(0, 0, 0, 0.40),
        0 4px 14px rgba(0, 0, 0, 0.42);
    }
    #tc button#tc-right:active {
      background: radial-gradient(circle at 50% 50%, rgba(255, 220, 156, 0.68), rgba(255, 150, 74, 0.22) 55%, rgba(9, 5, 3, 0.3));
      color: #fff3d8; transform: scale(0.95);
      box-shadow: inset -1px 1px 2px rgba(255, 236, 200, 0.4), 0 0 20px rgba(255, 185, 100, 0.5), 0 3px 10px rgba(0, 0, 0, 0.35);
      text-shadow: 0 0 12px rgba(255, 214, 150, 0.7);
    }
    /* 右手·主动作：跃(大) 主跳、冲 疾冲——同为玄石碟 */
    #tc-jump { width: 17vh; height: 17vh; font-size: 7vh;
      right: calc(3.5vw + env(safe-area-inset-right, 0px)); bottom: calc(4.5vh + env(safe-area-inset-bottom, 0px)); }
    #tc-dash { width: 12.5vh; height: 12.5vh; font-size: 5.4vh;
      right: calc(3.5vw + env(safe-area-inset-right, 0px) + 18.5vh); bottom: calc(9.5vh + env(safe-area-inset-bottom, 0px)); }
    /* 大招·跨步：神力满时自天际升起如小日轮、脉动待发（以脉动别于"进"的常亮暖核） */
    #tc button#tc-ult { width: 14vh; height: 14vh; font-size: 5vh; display: none;
      right: calc(4.5vw + env(safe-area-inset-right, 0px)); bottom: calc(24vh + env(safe-area-inset-bottom, 0px));
      border-color: rgba(255, 198, 120, 0.82); color: rgba(255, 232, 186, 0.96);
      background: radial-gradient(circle at 50% 42%, rgba(255, 176, 92, 0.34), rgba(40, 20, 10, 0.46)); }
    #tc button#tc-ult:active {
      background: radial-gradient(circle at 50% 50%, rgba(255, 228, 168, 0.78), rgba(255, 150, 74, 0.24) 55%, rgba(9, 5, 3, 0.30));
      color: #fff3d8; transform: scale(0.95); text-shadow: 0 0 14px rgba(255, 214, 150, 0.8); }
    #tc button#tc-ult.ready { display: flex; animation: ultsun 1.6s ease-in-out infinite; }
    @keyframes ultsun {
      0%, 100% { box-shadow: inset -1.5px 1.5px 3px rgba(255, 236, 200, 0.28), 0 0 12px 2px rgba(255, 176, 92, 0.30), 0 4px 14px rgba(0, 0, 0, 0.4); }
      50% { box-shadow: inset -1.5px 1.5px 3px rgba(255, 236, 200, 0.4), 0 0 24px 8px rgba(255, 190, 110, 0.5), 0 0 44px 14px rgba(255, 160, 80, 0.22); }
    }
    @media (prefers-reduced-motion: reduce) {
      #tc button#tc-ult.ready { animation: none; box-shadow: 0 0 18px 5px rgba(255, 186, 104, 0.4); }
    }
  </style>

<body>
  <canvas id="game"></canvas>
  <!-- 源码链接：如仓库名不同，改此 href 即可 -->
  <a id="gh" href="https://github.com/rockbenben/kuafu" target="_blank" rel="noopener noreferrer">源码 · GitHub ↗</a>
  <!-- 换形象：文字由 applyAvatarLocale() 按当前语种填入，此处留空不写死任何一种语言 -->
  <div id="avbar">
    <div id="avrow">
      <button id="av" type="button" aria-expanded="false">
        <img id="av-thumb" alt="">
        <span id="av-label"></span>
      </button>
      <span id="av-reset" role="button" tabindex="0" hidden></span>
      <!-- 预设按钮由 buildAvPicker() 插在「+」之前；此处只留上传口 -->
      <div id="avpick" role="group">
        <label id="av-more" class="avopt" tabindex="0"><span>＋</span><input id="av-file" type="file" accept="image/*"></label>
      </div>
    </div>
    <div id="avtip"></div>
  </div>
  <!-- 触屏控制按钮（仅触屏设备游玩时显示） -->
  <div id="tc" aria-hidden="true">
    <!-- 文字与 aria-label 由 TouchControls.applyLocale() 按当前语种填入，
         切语言时同步更新；此处留空，避免任何一种语言被写死 -->
    <button id="tc-left"></button>
    <button id="tc-right"></button>
    <button id="tc-dash"></button>
    <button id="tc-jump"></button>
    <button id="tc-ult"></button>
  </div>
